[project]
name = "gridcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mainak Dan", email = "mainak.dan@grenoble-inp.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "omegalpes>=1.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pulp<4",
    
]

[project.scripts]
gridcast = "gridcast:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors and warnings
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import ordering
    "B",        # bugbear: likely bugs (mutable defaults, bare except patterns)
    "UP",       # pyupgrade: modern syntax (list[str], X | None)
    "SIM",      # simplifications
    "C4",       # comprehension cleanups
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # long data lines in tests are fine

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/gridcast"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["omegalpes.*", "lpfics.*", "pulp.*"]
ignore_missing_imports = true